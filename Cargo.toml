# Libraries live in crates/, the applications built on them in apps/.
[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

# Versions live here so the crates cannot drift apart on a shared dependency.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
free-agent = { path = "crates/free-agent" }

[workspace.package]
version = "0.1.0"
edition = "2024"
