# The library lives at the root, the applications built on it in apps/, and
# the crates they share in crates/.
[package]
name = "free-agent"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "Episodes in which actors talk to each other by sending messages"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/free-agent"
keywords = ["actor", "agent", "multi-agent", "episode", "tokio"]
categories = ["asynchronous", "simulation"]
# What goes to crates.io: the library, not the website or the workflows.
include = ["src/**", "README.md", "LICENSE-*"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Only the library mints IDs; everything else just carries them.
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# A paused clock makes the timing tests exact, and the README's example runs
# on the multi-threaded runtime an application would use.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[workspace]
# The desktop shell sits inside the viewer's frontend, out of reach of apps/*.
members = ["apps/*", "crates/*", "apps/social-deduction-gui/src-tauri"]
# Without this a bare cargo command at the root would skip the applications.
# The viewer's frontend is built for the browser, by Trunk, and the desktop
# shell needs the system's webview libraries, so both are left out.
default-members = [".", "apps/social-deduction", "crates/social-deduction-cues"]
resolver = "3"

# Versions live here so the crates cannot drift apart on a shared dependency.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures-util = "0.3.34"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
minijinja = "3.0.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["time"] }
tracing = "0.1.44"
# The key-leak tests capture every event at TRACE.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The desktop app writes its settings, and exports configurations, as TOML.
toml = { version = "1.1.8", default-features = false, features = ["display", "parse", "serde", "std"] }
rand = "0.10.3"
# Only what reaching a model needs: rustls and JSON, nothing by default.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
# Serde alone, so the viewer's crates build for wasm32-unknown-unknown.
uuid = { version = "1.27.0", features = ["serde"] }
free-agent = { path = "." }
social-deduction = { path = "apps/social-deduction" }
social-deduction-cues = { path = "crates/social-deduction-cues" }

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wpm/FreeAgent"
homepage = "https://wpm.github.io/FreeAgent/"
