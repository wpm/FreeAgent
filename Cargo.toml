# The library lives at the root, the applications built on it in apps/.
[package]
name = "free-agent"
version.workspace = true
edition.workspace = true
description = "Episodes in which actors talk to each other by statement, request, and reply"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/free-agent"
keywords = ["actor", "agent", "multi-agent", "episode", "tokio"]
categories = ["asynchronous", "simulation"]
# What goes to crates.io: the library, not the website or the workflows.
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE-*"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
# A paused clock makes the timing tests exact, and the README's example runs
# on the multi-threaded runtime an application would use.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[workspace]
members = ["apps/*"]
# Without this a bare cargo command at the root would skip the applications.
default-members = [".", "apps/*"]
resolver = "3"

# Versions live here so the crates cannot drift apart on a shared dependency.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures-util = "0.3.34"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
humantime-serde = "1.1.1"
minijinja = "3.0.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.20"
# Only parsing: nothing writes TOML.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
rand = "0.10.3"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
# The version lets a crate that depends on the library be published too.
free-agent = { path = ".", version = "0.1.0" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wpm/FreeAgent"
homepage = "https://wpm.github.io/FreeAgent/"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
