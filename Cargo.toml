# The library lives at the root, the applications built on it in apps/.
[package]
name = "free-agent"
version.workspace = true
edition.workspace = true
description = "Small agents that perceive, act, and talk to each other"
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
# A paused clock makes the timing tests exact, and the README's example runs
# on the multi-threaded runtime an application would use.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[workspace]
members = ["apps/*"]
# Without this a bare cargo command at the root would skip the applications.
default-members = [".", "apps/*"]
resolver = "3"

# Versions live here so the crates cannot drift apart on a shared dependency.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
free-agent = { path = "." }

[workspace.package]
version = "0.1.0"
edition = "2024"
