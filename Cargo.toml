# The library lives at the root, the applications built on it in apps/.
[package]
name = "free-agent"
version.workspace = true
edition.workspace = true
description = "Episodes in which actors talk to each other by request and reply"
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
serde_json.workspace = true
# A paused clock makes the timing tests exact, and the README's example runs
# on the multi-threaded runtime an application would use.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[workspace]
members = ["apps/*"]
# Without this a bare cargo command at the root would skip the applications.
default-members = [".", "apps/*"]
resolver = "3"

# Versions live here so the crates cannot drift apart on a shared dependency.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7.19"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"
toml = "0.8"
free-agent = { path = "." }

[workspace.package]
version = "0.1.0"
edition = "2024"
