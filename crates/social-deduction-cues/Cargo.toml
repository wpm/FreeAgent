[package]
name = "social-deduction-cues"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "The cues a social deduction game's viewer is drawn from"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The viewer's own types, shared by its game-folding code and its frontend.
publish = false

# Serde, minijinja to read templates, and the episode IDs a log's games
# are told apart by, so the crate builds for wasm32-unknown-unknown.
[dependencies]
minijinja.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
