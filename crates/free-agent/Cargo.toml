[package]
name = "free-agent"
version.workspace = true
edition.workspace = true
description = "Small agents that perceive, act, and talk to each other"
readme = "README.md"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
futures.workspace = true
tempfile.workspace = true
# A paused clock makes the timing tests exact, and the README's example runs
# on the multi-threaded runtime an application would use.
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
