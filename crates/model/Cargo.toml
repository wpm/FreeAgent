[package]
name = "free-agent-model"
version = "0.0.0"
edition.workspace = true
description = "Reaching, listing, probing and ranking the language models Free Agent's apps play with"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Shared by the apps, which ship as binaries, never published on its own.
publish = false

[features]
# A fake model and canned providers for an app's tests, which turn it on
# in their [dev-dependencies].
test-support = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
free-agent-gui-types.workspace = true
futures-util.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
# A paused clock lets a test wait out a fake model's delay without waiting.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
