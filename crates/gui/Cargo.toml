[package]
name = "free-agent-gui"
version = "0.0.0"
edition.workspace = true
description = "The look every Free Agent app's web frontend shares: tokens, chrome, the main window's parts and the Settings window"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Shared by the apps' frontends, which ship as pages, never published on
# its own.
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# App talk needs no code highlighting or math fonts.
leptos-rich-chat = { version = "0.2.2", default-features = false }
free-agent-gui-types.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "CssStyleDeclaration", "Document", "DomRect", "DomTokenList", "Element", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "Navigator", "PointerEvent", "ResizeObserver", "Window"] }
