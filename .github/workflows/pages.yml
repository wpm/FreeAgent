name: Website

# The site under site/ goes to GitHub Pages on every push to main, with the
# viewer at viewer/ showing a random game of Avalon and one of Werewolf,
# played for the push, and Twenty Questions' web page at
# twenty-questions/viewer/ playing its recorded games. Each product's download links go to its newest full
# release, whose latest.json, where the desktop app looks for updates, is
# served at <product>/latest.json. A product's release workflow runs this
# once the release's files are up, and a link to a file the release lacks
# fails the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and the one in progress finishes.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the page breaks in the browser when built by trunk 0.22.0.
          tool: trunk@0.21.14
      # The page's footer names the commit, from GITHUB_SHA, which Actions
      # sets for every step.
      - run: apps/social-deduction/gui/build-page.sh
      - run: cp -R apps/social-deduction/gui/dist site/viewer
      # Beside the twenty-questions/latest.json the Releases step puts there.
      - run: apps/twenty-questions/gui/build-page.sh /FreeAgent/twenty-questions/viewer/
      - run: mkdir -p site/twenty-questions && cp -R apps/twenty-questions/gui/dist site/twenty-questions/viewer
      # Each {{release:<product>}} placeholder becomes the address of the
      # product's newest full release, which has to have every file the
      # site links to.
      - name: Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate > "$RUNNER_TEMP/releases.json"
          .github/scripts/site-releases.sh site < "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/releases.txt"
          while read -r product tag; do
            assets=$RUNNER_TEMP/$product.assets
            jq -rs --arg tag "$tag" 'add[] | select(.tag_name == $tag) | .assets[].name' "$RUNNER_TEMP/releases.json" > "$assets"
            .github/scripts/site-downloads.sh site "$tag" "$assets"
            if grep -qx latest.json "$assets"; then
              mkdir -p "site/$product"
              gh release download "$tag" --pattern latest.json --dir "site/$product"
            fi
          done < "$RUNNER_TEMP/releases.txt"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
