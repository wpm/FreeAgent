name: Publish to crates.io

# Publishes the free-agent library for a release published in the
# Releases page with a free-agent-v<version> tag, at the tag's version,
# which .github/scripts/stamp-version.sh stamps into its manifest. A
# prerelease version is published as a crates.io prerelease. Releases of
# other products are skipped. The token comes from crates.io's trusted
# publishing, which trusts this workflow file by name and the release
# environment; no secret is stored here.
on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    name: cargo publish
    if: startsWith(github.event.release.tag_name, 'free-agent-v')
    runs-on: ubuntu-latest
    environment: release
    # The OIDC token that crates.io exchanges for a publish token.
    # Checking out a public repository needs nothing more.
    permissions:
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - id: version
        run: .github/scripts/stamp-version.sh "$TAG"
      # A version crates.io already has is left alone, so a re-run passes.
      - name: Look for the version on crates.io
        id: look
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if curl --fail --silent --show-error --output /dev/null \
               --user-agent "wpm/FreeAgent release workflow" \
               "https://crates.io/api/v1/crates/free-agent/$VERSION"; then
            echo "free-agent $VERSION is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.look.outputs.published != 'true'
        id: auth
      # The stamped manifest and lock file are the only changes in the tree.
      - if: steps.look.outputs.published != 'true'
        run: cargo publish -p free-agent --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
