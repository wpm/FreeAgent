name: CodeQL

# Code scanning runs on every push to main and once a week, and never on a
# pull request. Every language is analyzed from source, so nothing is
# compiled, with the default query suite.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

# A newer push to main makes the scan in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
