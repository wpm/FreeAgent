name: CI

# The run on main is what fills the build cache that a new pull request
# starts from: a cache saved by one pull request is invisible to the others.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the run in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy's lints are warnings, which on their own would never fail the job.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
      # The viewer's frontend builds the cue types for the browser.
      - run: cargo check -p social-deduction-stage --target wasm32-unknown-unknown

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Rustdoc's complaints, a broken link among them, are warnings too.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The viewer's frontend builds for the browser, so the jobs above leave it
  # out. This one checks it natively and for wasm, then builds the page the
  # Website workflow deploys, from a freshly played game.
  viewer:
    name: Viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo clippy -p social-deduction-gui --all-targets -- -D warnings
      - run: cargo test -p social-deduction-gui
      - run: cargo check -p social-deduction-gui --target wasm32-unknown-unknown
      - name: Play a random game of Avalon and fold its log into cues
        run: |
          cargo run --release -p social-deduction -- play apps/social-deduction/configs/avalon/random.toml 2> game.jsonl > /dev/null
          cargo run --release -p social-deduction --example stage < game.jsonl > apps/social-deduction-gui/cues.json
      - run: trunk build --release --public-url /FreeAgent/viewer/
        working-directory: apps/social-deduction-gui

  # The one check a ruleset needs to require: it passes only if every job it
  # needs did, so jobs can come and go without the ruleset changing.
  required:
    name: Required
    needs: [format, clippy, test, docs, viewer]
    # Without always() a failure above would skip this job, and a ruleset
    # counts a skipped check as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq 'map_values(.result)' <<< "$NEEDS"
          jq --exit-status 'all(.result == "success")' <<< "$NEEDS"

  # Deliberately not one of Required's jobs: an outage at Codecov should not
  # block a merge, and the tests it runs already gate one in Build and test.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Without --workspace the tests of the applications still run, but the
      # report leaves their source files out. The viewer's frontend is the
      # browser's, and the Viewer job tests it.
      - run: cargo llvm-cov --workspace --exclude social-deduction-gui --lcov --output-path lcov.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wpm/FreeAgent
          files: lcov.info
          # The upload's default is to fail silently.
          fail_ci_if_error: true
