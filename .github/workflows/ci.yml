name: CI

# The run on main is what fills the build cache that a new pull request
# starts from: a cache saved by one pull request is invisible to the others.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the run in progress pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy's lints are warnings, which on their own would never fail the job.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - run: cargo test
      # The frontends build their gui-types, and the shared ones, for the
      # browser.
      - run: cargo check -p free-agent-gui-types --target wasm32-unknown-unknown
      - run: cargo check -p social-deduction-gui-types --target wasm32-unknown-unknown
      - run: cargo check -p twenty-questions-gui-types --target wasm32-unknown-unknown

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Rustdoc's complaints, a broken link among them, are warnings too.
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The apps' frontends and the shared look they are built on build for the
  # browser, so the jobs above leave them out. One leg per app checks its
  # page natively and for wasm, builds it, and drives it in headless
  # Chromium: Social Deduction's from freshly played games and the recorded
  # prompted ones, along with the website's download section as visitors
  # on each platform see it, and Twenty Questions' playing its recorded
  # game through a stand-in for the desktop app's backend.
  viewer:
    name: Viewer (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Social Deduction, app: social-deduction, crates: -p free-agent-gui -p social-deduction-gui }
          - { name: Twenty Questions, app: twenty-questions, crates: -p twenty-questions-gui }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          # Pinned: the page breaks in the browser when built by trunk 0.22.0.
          tool: trunk@0.21.14
      - run: cargo clippy ${{ matrix.crates }} --all-targets -- -D warnings
      - run: cargo test ${{ matrix.crates }}
      - run: cargo check ${{ matrix.crates }} --target wasm32-unknown-unknown
      - run: apps/${{ matrix.app }}/gui/build-page.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/gui/e2e/package-lock.json
      - run: npm ci
        working-directory: apps/${{ matrix.app }}/gui/e2e
      # Playwright's Chromium, kept between runs for as long as the lock
      # file pins the same Playwright.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(format('apps/{0}/gui/e2e/package-lock.json', matrix.app)) }}
      - run: npx playwright install --with-deps chromium
        working-directory: apps/${{ matrix.app }}/gui/e2e
      - run: npm test
        working-directory: apps/${{ matrix.app }}/gui/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.app }}-screenshots
          path: apps/${{ matrix.app }}/gui/e2e/screenshots

  # The desktop shells, the shared one and each app's, need each
  # platform's webview, so the jobs above leave them out. One leg per app
  # and platform, since the shells have code only one platform compiles:
  # the macOS menus, command-line tool and dev app bundle, and the Windows
  # subsystem attribute.
  desktop:
    name: Desktop (${{ matrix.app }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        app: [social-deduction, twenty-questions]
        platform:
          - { name: Linux, os: ubuntu-latest }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Only Linux needs system packages: macOS and Windows ship their
      # webviews, and their credential stores need no library. The Secret
      # Service is reached through D-Bus.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libdbus-1-dev
      # The command line the app carries, which tauri-build copies beside
      # the app's binary and fails without. A debug build shares what the
      # tests build.
      - run: .github/scripts/sidecar.sh ${{ matrix.app }} --debug
        shell: bash
      - run: cargo clippy -p free-agent-desktop -p ${{ matrix.app }}-desktop --all-targets -- -D warnings
      - run: cargo test -p free-agent-desktop -p ${{ matrix.app }}-desktop

  # The workflows and the release scripts, which otherwise run only at a
  # release.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # actionlint's own installer, pinned. The runner has shellcheck, which
      # actionlint runs on each script step.
      - run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint
      - run: shellcheck .github/scripts/*.sh
      - run: .github/scripts/release-scripts-test.sh

  # The one check a ruleset needs to require: it passes only if every job it
  # needs did, so jobs can come and go without the ruleset changing.
  required:
    name: Required
    needs: [format, clippy, test, docs, viewer, desktop, workflows]
    # Without always() a failure above would skip this job, and a ruleset
    # counts a skipped check as passing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq 'map_values(.result)' <<< "$NEEDS"
          jq --exit-status 'all(.result == "success")' <<< "$NEEDS"

  # Deliberately not one of Required's jobs: an outage at Codecov should not
  # block a merge, and the tests it runs already gate one in Build and test.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Without --workspace the tests of the applications and the shared
      # crates still run, but the report leaves their source files out. The
      # apps' frontends and the shared look are the browser's, and the
      # Viewer jobs test them. The desktop shells are wiring: Tauri
      # commands, windows, menus and dialogs around each app's live and
      # settings modules and free_agent_model's catalog and secret modules,
      # which are measured here, the keyring store and the macOS dev bundle.
      # They need a webview to build, so the Desktop jobs test them.
      - run: cargo llvm-cov --workspace --exclude free-agent-gui --exclude social-deduction-gui --exclude twenty-questions-gui --exclude free-agent-desktop --exclude social-deduction-desktop --exclude twenty-questions-desktop --lcov --output-path lcov.info
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wpm/FreeAgent
          files: lcov.info
          # The upload's default is to fail silently.
          fail_ci_if_error: true
