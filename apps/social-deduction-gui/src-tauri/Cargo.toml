[package]
name = "social-deduction-desktop"
version.workspace = true
edition.workspace = true
description = "The viewer for social deduction games as a desktop app that plays a game live"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The desktop app ships as installers, not as a crate.
publish = false

[package.metadata.dist]
dist = false

[lib]
name = "social_deduction_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
secrecy.workspace = true
social-deduction.workspace = true
social-deduction-cues.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
tracing.workspace = true
