[package]
name = "twenty-questions-gui-types"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "The types Twenty Questions' native code shares with its WASM frontend"
license.workspace = true
repository.workspace = true
