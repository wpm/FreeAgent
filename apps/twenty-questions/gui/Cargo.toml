[package]
name = "twenty-questions-gui"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "Twenty Questions' page: a group chat under the secret object and the guesses used"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The desktop app's page, built with Trunk; it ships as a page, not a crate.
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Game talk needs no code highlighting or math fonts.
leptos-rich-chat = { version = "0.2.2", default-features = false }
free-agent-gui.workspace = true
twenty-questions-gui-types.workspace = true
console_error_panic_hook = "0.1"
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["console", "Location", "Navigator", "Performance", "Response", "Window"] }

[dev-dependencies]
# The screen's tests fold the recorded game.
twenty-questions.workspace = true
uuid.workspace = true
