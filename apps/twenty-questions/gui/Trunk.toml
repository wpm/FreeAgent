[build]
target = "index.html"

# The desktop app's window loads the page from here in development, on a
# port of its own so that Social Deduction's can run beside it.
[serve]
port = 1421
open = false

[watch]
# The page and the shared look it is built on.
watch = [".", "../../../crates/gui"]
# The desktop shell writes under src-tauri as it builds; that is not a
# reason to rebuild the page.
ignore = ["src-tauri"]
