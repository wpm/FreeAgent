[package]
name = "twenty-questions"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "Twenty Questions, played by language models: players put guesses to a host who holds a secret object"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The applications ship as binaries from GitHub Releases, never to crates.io.
publish = false

[features]
# Twenty Questions' canned player and the canned providers that play it,
# for its own integration tests, which turn it on below.
test-support = ["free-agent-model/test-support"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
free-agent.workspace = true
free-agent-game.workspace = true
free-agent-gui-types.workspace = true
free-agent-model.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
minijinja.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util.workspace = true
toml.workspace = true
twenty-questions-gui-types.workspace = true
uuid.workspace = true

[build-dependencies]
# The embedding of the example configurations alone.
free-agent-game = { path = "../../../crates/game", default-features = false }

[dev-dependencies]
# The models in play a story is told of.
free-agent-game = { workspace = true, features = ["test-support"] }
# The fake model and the canned providers, and Twenty Questions' own
# canned player, which its integration tests reach through this crate.
free-agent-model = { workspace = true, features = ["test-support"] }
twenty-questions = { workspace = true, features = ["test-support"] }
# The binary's tests edit the example configuration.
toml.workspace = true
# A paused clock lets a test wait out the game's time limit without waiting.
tokio = { workspace = true, features = ["test-util"] }
