[package]
name = "social-deduction-stage"
version.workspace = true
edition.workspace = true
description = "The cues a social deduction game's viewer is drawn from"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The viewer's own types, shared by its game-folding code and its frontend.
publish = false

[package.metadata.dist]
dist = false

# Serde, minijinja to read templates, and the episode IDs a log's games
# are told apart by, so the crate builds for wasm32-unknown-unknown.
[dependencies]
minijinja.workspace = true
serde.workspace = true
uuid = { version = "1.27.0", features = ["serde"] }

[dev-dependencies]
serde_json.workspace = true
