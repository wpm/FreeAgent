# The least a model-played game needs: one model and one prompted strategy
# for everyone. The rules live in a text block the prompt pulls in, and the
# prompt tells a werewolf apart from the rest with one conditional. Run it
# with
#
#     social-deduction werewolf prompted.toml

# Every role not allotted otherwise plays this strategy.
strategy = "everyone"

[phases]
ratify_limit = "20s"

# A Qwen model on a local LM Studio server. The id and base URL will likely
# need changing to whatever model and server you have running.
[models.qwen]
base_url = "http://localhost:1234/v1"
id = "qwen2.5-7b-instruct-1m"
# The model's context window in tokens, over what the provider reports.
# context_window = 32768

[text]
rules = """
Werewolf is a game of hidden roles. A few of the players are secretly
werewolves; the rest are villagers, among them a doctor and a seer. Play
alternates between night and day. By night the werewolves choose a villager
to kill, the doctor chooses one player to save from that kill, and the seer
learns one player's side. By day everyone may talk at any time, with no
turns, and whatever you say goes to every other living player. Each time
you are asked by day, you may speak, vote, or wait. While the day is open
you may change your vote, or withdraw it and be undecided again. Once one
player has had the most votes for 20s without the decision changing, that
player is eliminated. A tie eliminates nobody. The villagers win when the
last werewolf is dead. The werewolves win when they are at least as many as
the villagers.
"""

[strategies.everyone]
policy = "prompted"
system = """
{{ rules }}

You are {{ name }}, a {{ role }}.
{% if role == "werewolf" %}
You know who the other werewolves are. Kill a villager each night and avoid
being voted out by day.
{% endif %}
"""
