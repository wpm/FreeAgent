# What the model client knows, compiled in. Adding to it is an edit here and
# a rebuild.

# The fields a model's entry in a provider's listing, GET /v1/models, may
# carry its context window under, in tokens: vLLM's and OpenRouter's. The
# first of them holding a positive whole number is the window.
context_window_fields = ["max_model_len", "context_length"]

# The ports the desktop app looks for a local server on, at
# http://localhost:<port>/v1: LM Studio's, Ollama's, llama.cpp's and vLLM's.
local_ports = [1234, 11434, 8080, 8000]

# Words in a model's id that say it does not chat, such as an embedding or a
# speech model. The desktop app never asks such a model to play.
hide = ["embedding", "tts", "whisper", "transcribe", "dall-e", "image", "moderation", "realtime", "audio"]

# Providers known, in the order the help lists them. Each has the name the
# desktop app shows, the root of its
# OpenAI-compatible API, ending in /v1, as a base URL is given on the command
# line; the environment variable that conventionally holds its API key, if it
# wants one; the headers every request to it must carry, if any; and the
# context window, in tokens, of the models it serves, for a listing that
# reports none. A base URL at or under the root is read with the variable,
# unless another is named, sent the headers, and given the window.

# OpenAI's chat models take 128000 tokens or more.
[[providers]]
name = "OpenAI"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
context_window = 128000

# Anthropic's models take 200000 tokens.
[[providers]]
name = "Anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
headers = { anthropic-version = "2023-06-01" }
context_window = 200000
