[package]
name = "social-deduction-desktop"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "The viewer for social deduction games as a desktop app that plays a game live"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The desktop app ships as installers, not as a crate.
publish = false

[lib]
name = "social_deduction_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
free-agent-desktop.workspace = true
free-agent-model.workspace = true
futures-util.workspace = true
secrecy.workspace = true
social-deduction.workspace = true
social-deduction-gui-types.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener = "2"
tauri-plugin-updater.workspace = true
serde.workspace = true
# tauri::generate_context! reads the updater plugin's config with it.
serde_json.workspace = true
tracing.workspace = true
