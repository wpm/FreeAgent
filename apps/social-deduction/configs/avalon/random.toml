# Every role played by the random strategy, which is always defined: a
# table of random players with no models. Run it from the root of a
# release archive, or from apps/social-deduction in a checkout, with
#
#     social-deduction play configs/avalon/random.toml

game = "avalon"

[roles.merlin]
strategy = "random"

[roles.percival]
strategy = "random"

[roles.servant]
strategy = "random"

[roles.assassin]
strategy = "random"

[roles.morgana]
strategy = "random"

[roles.mordred]
strategy = "random"

[roles.oberon]
strategy = "random"

[roles.minion]
strategy = "random"
