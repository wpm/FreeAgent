# Every role played by the random strategy, which is always defined: a table
# of random players with no models. `social-deduction configs --write .`
# writes it out, and
#
#     social-deduction play avalon/random.toml
#
# plays it.

game = "avalon"

[roles.merlin]
strategy = "random"

[roles.percival]
strategy = "random"

[roles.servant]
strategy = "random"

[roles.assassin]
strategy = "random"

[roles.morgana]
strategy = "random"

[roles.mordred]
strategy = "random"

[roles.oberon]
strategy = "random"

[roles.minion]
strategy = "random"
