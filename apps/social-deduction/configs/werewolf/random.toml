# Every role played by the random strategy, which is always defined: a table
# of random players with no models. `social-deduction configs --write .`
# writes it out, and
#
#     social-deduction play werewolf/random.toml
#
# plays it.

format = 1
game = "werewolf"

[roles.werewolf]
strategy = "random"

[roles.villager]
strategy = "random"

[roles.doctor]
strategy = "random"

[roles.seer]
strategy = "random"
