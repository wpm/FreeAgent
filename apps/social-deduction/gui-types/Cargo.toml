[package]
name = "social-deduction-gui-types"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "The types Social Deduction's native code shares with its WASM frontend"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Social Deduction's own types, shared by its native code and its frontend.
publish = false

# The shared types, serde, minijinja to read templates, and the episode IDs a log's games
# are told apart by, so the crate builds for wasm32-unknown-unknown.
[dependencies]
free-agent-gui-types.workspace = true
minijinja.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
