[package]
name = "social-deduction"
# The release workflow stamps the version from the tag; see RELEASING.md.
version = "0.0.0"
edition.workspace = true
description = "Social deduction games, played at random or by language model"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The applications ship as binaries from GitHub Releases; the library is what
# goes to crates.io. Drop this line to publish the application there too.
publish = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
clap.workspace = true
free-agent.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
minijinja.workspace = true
rand.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
social-deduction-cues.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# A paused clock lets a test wait out a day's time limit without waiting.
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true
