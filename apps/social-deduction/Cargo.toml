[package]
name = "social-deduction"
version.workspace = true
edition.workspace = true
description = "Social deduction games, played at random or by language model"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The applications ship as binaries from GitHub Releases; the library is what
# goes to crates.io. Drop this line to publish the application there too.
publish = false

# Which is not to say dist should skip it: it is the binary dist ships.
[package.metadata.dist]
dist = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
clap.workspace = true
free-agent.workspace = true
humantime.workspace = true
humantime-serde.workspace = true
minijinja.workspace = true
rand.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml.workspace = true

[dev-dependencies]
# A paused clock lets a test wait out a day's time limit without waiting.
# The tests answer the model client from a local listener.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
serde_json.workspace = true
